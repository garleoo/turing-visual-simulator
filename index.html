<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina de Turing - Paridad de Cadenas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar-info">
        <label class="machine-label">
<b>M = {Σ, Γ, Q, S, q0, q8, |}</b><br>
Σ = {a, b}<br>
Γ = {a, b, X, Y, |}<br>
Q = {q0, q1, q2, q3, q4, q5, q6, q7, q8, q9, q10}<br>
<b>S =</b> {<br>
<span style="white-space: pre-line;">
q0: Estado inicial<br>
(q0,X)=(q0,X,R), (q0,Y)=(q0,Y,R), (q0,a)=(q1,X,R), (q0,b)=(q2,Y,R), (q0,|)=(q7,|,R)<br>
q1:<br>(q1,a)=(q1,a,R), (q1,b)=(q1,b,R), (q1,|)=(q3,|,R)<br>
q2:<br>(q2,a)=(q2,a,R), (q2,b)=(q2,b,R), (q2,|)=(q4,|,R)<br>
q3:<br>(q3,X)=(q3,X,R), (q3,Y)=(q3,Y,R), (q3,b)=(q3,b,R), (q3,_)=(q5,X,L), (q3,a)=(q5,X,L)<br>
q4:<br>(q4,X)=(q4,X,R), (q4,Y)=(q4,Y,R), (q4,a)=(q4,a,R), (q4,b)=(q5,Y,L), (q4,_)=(q5,Y,L)<br>
q5:<br>(q5,X)=(q5,X,L), (q5,Y)=(q5,Y,L), (q5,a)=(q5,a,L), (q5,b)=(q5,b,L), (q5,_)=(q0,_,R), (q5,|)=(q5,|,L)<br>
q6:<br>(q6,X)=(q6,a,L), (q6,Y)=(q6,b,L), (q6,|)=(q6,|,L), (q6,_)=(q8,_,S)<br>
q7:<br>(q7,a)=(q9,X,L), (q7,b)=(q10,Y,L), (q7,X)=(q7,X,R), (q7,Y)=(q7,Y,R), (q7,_)=(q6,_,L)<br>
q8: Estado final<br>
q9:<br>(q9,X)=(q9,X,L), (q9,Y)=(q9,Y,L), (q9,|)=(q9,|,L), (q9,_)=(q0,X,R)<br>
q10:<br>(q10,X)=(q10,X,L), (q10,Y)=(q10,Y,L), (q10,|)=(q10,|,L), (q10,_)=(q0,Y,R)<br>
}</span>
<br><br>
<b>Tabla de transiciones</b>
<div id="transitions-table"></div>
        </label>
    </div>
    <div class="container">
    <h1>Máquina de Turing - Paridad de cadenas a's y b's</h1>
    <p class="video-link">Video: <a href="https://drive.google.com/drive/folders/1i06MP8EvUNl0quWU1uw04zCDKweTiQo9?usp=sharing" target="_blank" rel="noopener">https://drive.google.com/drive/folders/1i06MP8EvUNl0quWU1uw04zCDKweTiQo9?usp=sharing</a></p>
        <div class="input-section">
            <label for="input-string">Ingrese sus palabras (ingrese sus cadenas de a's y b's separadas por |):</label>
            <input type="text" id="input-string" placeholder="Ejemplo: abb|aab">
            <button onclick="processInput()">Procesar</button>
        </div>
        <div class="output-section">
            <h2>ID de la Máquina:</h2>
            <div id="turing-id" class="id-output"></div>

            <div id="diagram-wrapper">
                <h3>Diagrama de la Máquina</h3>
                <div id="diagram-container"></div>
            </div>

            <div class="tape-controls">
                <button id="prev-step">◀ Anterior</button>
                <button id="play-pause">▶ Play</button>
                <button id="next-step">Siguiente ▶</button>
                <button id="reset">Reset</button>
                <span id="step-info"></span>
            </div>

            <div id="tape-container" class="tape"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
